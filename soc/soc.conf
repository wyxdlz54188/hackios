# socs/sm8250/soc.conf: what this SoC repository is: the facts of a Qualcomm SM8250 ("kona",
# Snapdragon 865 / 865+, with the SDX55 modem), whatever phone it is in. A phone with this SoC
# includes soc/configs/sm8250.config from its defconfig.
#
# Same shape as the reference SoC layer of the SC7280 family (devices/redwood/soc/soc.conf).

soc sm8250
	title       Qualcomm SM8250 (Snapdragon 865 / 865+; "kona"; with the SDX55 modem)
	vendor      Qualcomm
	cores       8, the biggest is core 7
	gpu         Adreno 650
	maintainer  the HakiOS port of the OnePlus 8T (README.md)
