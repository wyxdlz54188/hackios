# devices/oneplus8t/device.conf: what this device repository is. tools/hakios-device.py reads it and
# the device's documentation page is made from it, so the status is said in one place.
#
# Every value here was read from the phone itself (adb, root): adb shell getprop, /proc/device-tree,
# /proc/partitions, /sys. docs/device-report.md has the raw evidence and where each number came from.
#
# status: only what has been seen working ON THIS PHONE is "works"; written but not yet seen is
# "partial" with a note; not there is "missing".

device oneplus8t
	title       OnePlus 8T (KB2000, "instantnoodle")
	vendor      OnePlus
	soc         sm8250
	defconfig   oneplus8t_defconfig
	firmware    pull-firmware.sh
	maintainer  the HakiOS port of this device (README.md)
	status      display     missing   UEFI's framebuffer is all there is: kona draws through SDE/DSI (panel oplus20828samsung_amb655x, 1080x2400, 120 Hz), and the port has no SDE driver
	status      touch       missing   Synaptics S3908 on i2c@a94000 (0x4B), one virtual "touchpanel" input; HakiOS has Goodix GT9916 and FocalTech FT3680 drivers only
	status      buttons     missing   PM8150 PMIC power/volume keys (gpio-keys + qpnp_pon); the buttons driver carries the reference phone's PMIC registers
	status      cpu         missing   8 cores: 4x Cortex-A55 (cpu0-3) + 3x Cortex-A77 (cpu4-6) + 1x A77 prime (cpu7); kona's EPSS clocks are not written
	status      gpu         missing   Adreno 650 (kgsl: Adreno650v3, DT chipid 0x06050002), GMU at 0x3d6a000, fw a650_*; hakios.adreno.c is the 642L's (GMU 0x3d69000) and hakios-metal refuses another chip id
	status      storage     partial   UFS 3.1 256 GB (sda 247013376 KB), A/B + dynamic partitions (super = sda15); read goes through UEFI's UFSDxe and the loader -- no kernel UFS driver -- not yet seen on this phone
	status      audio       missing   WCD938x codec + Bolero macros, sound card kona-mtp-snd-card; the audio DSP path is the reference phone's
	status      battery     missing   no ADSP path on this port yet (the level comes through it)
	status      haptic      missing   PM8150B haptics (qcom,haptics@c000, ff-memless "qti-haptics"), not the reference phone's Awinic AW86927
	status      camera      missing   not attempted
	status      torch       missing   not attempted
	status      wifi        missing   QCA6390 on PCIe (qcom,cnss-qca6390), not the WCN6750/ath11k of the reference phone
	status      bluetooth   missing   QCA6390's SLIMbus half (qcom,btfmslim_slave on slim@3ac0000)
	status      cellular    missing   SDX55 (ro.boot.baseband=mdm); IPA is 4.11 (qcom,ipa-hw-ver=0x11), the same layout the driver was written for; soc.args carries this phone's IPA/SMEM addresses
	status      thermal     missing   kona's thermal zones (30+ in the vendor tree) are at their own addresses; the driver's defaults are sc7280's
	status      usb         missing   dwc3 at a600000.dwc3
